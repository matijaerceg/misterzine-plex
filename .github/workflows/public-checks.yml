name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_public_content.py
      - run: python -m unittest discover -s tools -p 'test*.py'
      - run: python -m unittest discover -s release -p 'test*.py'
